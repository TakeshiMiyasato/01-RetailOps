name: retailops

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-RetailOps_Dev_2026!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RetailOps: "Server=sqlserver,1433;Database=RetailOps;User Id=sa;Password=${SQL_SA_PASSWORD:-RetailOps_Dev_2026!};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-docker-demo-signing-key-change-me-0123456789abcdef}
      Cors__Origins__0: http://localhost:3000
      ReverseProxy__TrustForwardedHeaders: "true"
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"

volumes:
  sqldata:
